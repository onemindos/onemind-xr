; OneMind engine config. UE 5.8 + Cesium for Unreal v2.30.0 (decision 0004 #14).

[/Script/EngineSettings.GameMapsSettings]
; The engine's empty Entry map: the globe, light and renderer are spawned in code by
; AOneMindGameMode, so the project ships no level asset. If a 5.8 install lacks
; /Engine/Maps/Entry, create an empty level at /Game/Maps/OneMind and point these at it
; (OWNER-STEPS.md, S1 step 2b).
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/OneMind.OneMindGameMode

[/Script/CesiumRuntime.CesiumRuntimeSettings]
; Offline cache (B2): Cesium keeps tile responses in a SQLite request cache. The default
; keeps 4,096 items (CesiumRuntimeSettings.h, v2.30.0); a city at street level needs more.
MaxCacheItems=200000
RequestsPerCachePrune=10000

[/Script/MacTargetPlatform.XcodeProjectSettings]
; Bundle id, decision 0004 #16. Key name is unverified for 5.8: confirm under
; Project Settings > Platforms > Xcode Projects (OWNER-STEPS.md, F1).
BundleIdentifier=org.onemindos.onemind

[/Script/Engine.Engine]
; Frame-rate measurements need an unsmoothed, uncapped frame time.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/Engine.RendererSettings]
; No ray tracing or path tracing; Lumen stays at engine defaults on the Mac.
r.RayTracing=False
