; --- OneMind bus (B3). No credentials here: ONEMIND_NATS_USER / ONEMIND_NATS_PASSWORD
; come from the environment at run time (repo rule 4).
[/Script/OneMindBus.OneMindBusSettings]
+Urls=ws://127.0.0.1:9222
ClientName=onemind-unreal-mac
ClientId=mac
PingIntervalMs=20000
ReconnectWaitMinMs=250
ReconnectWaitMaxMs=5000
MaxMessagesPerFrame=20000
; S5 probe (OWNER-STEPS.md S5): any `probe.*` key put into KV world-state is drawn as a
; marker. world-state's real keys are layer manifests `{layer}.meta` (BUS-DESIGN D3);
; probe keys are a local test only.
ProbeBucket=world-state
ProbeKeyFilter=probe.>
bWatchLayerManifests=True

; --- Globe (B2). Decision 0004 #4: open data, no Cesium ion, Google 3D Tiles off.
[/Script/OneMindGlobe.OneMindGlobeSettings]
TerrainUrl=
