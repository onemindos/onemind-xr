; --- Layers (B4). Ids from layer-snapshot.md §1; entity types follow ONTOLOGY.md where the
; contract table is stale (hazards = event/alert, not hazard; tak carries track for CoT
; tracks until a tracks layer exists; fleet leaves out edge until an edge producer exists).
; Proposal B-P9 (docs/evidence/M2/B/EVIDENCE.md) aligns the contract. Small layers use the
; direct ENT path on the Mac (a trusted site client next to its own leaf); large layers
; need the layer service (svc.layer.*, omos A5) and its AOI.
[/Script/OneMindLayers.OneMindLayersSettings]
LayersJson={"layers":[{"id":"fleet","title":"Fleet (sim-*)","entity_types":["drone","robot","vehicle","node"],"path":"direct","tier":"small"},{"id":"tak","title":"TAK","entity_types":["person","place","track"],"path":"direct","tier":"small"},{"id":"zones","title":"Zones","entity_types":["zone"],"path":"direct","tier":"small"},{"id":"hazards","title":"Hazards","entity_types":["event","alert"],"path":"direct","tier":"medium"},{"id":"air","title":"Aircraft","entity_types":["aircraft"],"path":"watch","tier":"large","max":5000},{"id":"sea","title":"Vessels","entity_types":["vessel"],"path":"watch","tier":"large","max":5000}]}
; B20: feeds behind each layer and alert kind; "expect" lists feeds that must exist (limit in s).
; nws-alerts is the omos-ingest source id with staleAfter 10m (PR #553, platform/ingest/configmap.yaml).
GapsJson={"layers":{"hazards":["nws-alerts"]},"alerts":{"severe_weather":["nws-alerts"]},"expect":{"nws-alerts":600}}
+DefaultOn=fleet
+DefaultOn=tak
AoiUpdateSeconds=2.0

