# Source 2 - HTTP long poll (NWS-style alerts). Server holds the request up to 10 s; cursor kept in memory.
input:
  generate: { interval: 1s, mapping: 'root = ""' }   # empty body: the http processor sends the message as the request body   # next request as soon as the previous returns (rate-limited)
pipeline:
  processors:
    - branch:
        request_map: 'root = ""'
        processors:
          - cache: { resource: live, operator: get, key: cursor.nws }
          - catch: [ { mapping: 'root = "-1"' } ]
        result_map: 'meta cursor = content().string()'
    - http:
        url: http://127.0.0.1:38080/nws/longpoll?cursor=${! @cursor }
        verb: GET
        rate_limit: rl_nws
        timeout: 15s
        retries: 3
        retry_period: 1s
        max_retry_backoff: 30s
        backoff_on: [ 429, 503 ]
    - catch:
        - branch:
            request_map: 'root = {"fetchedAt": null, "code": @http_status_code.or("0"), "count": 0, "lastError": error(), "errorAt": now()}'
            processors:
              - cache: { resource: live, operator: set, key: "status.nws.error", value: '${! content() }' }
        - mapping: root = deleted()
    - branch:
        request_map: 'root = {"fetchedAt": now(), "code": @http_status_code.or("0"), "count": this.alerts.length(), "lastError": null}'
        processors:
          - cache: { resource: live, operator: set, key: "status.nws", value: '${! content() }' }
    - branch:
        request_map: 'root = this.cursor.string()'
        processors:
          - cache: { resource: live, operator: set, key: cursor.nws, value: '${! content() }' }
    - mapping: 'root = this.alerts'
    - unarchive: { format: json_array }
    - json_schema:
        schema: '{"type":"object","required":["id","event","sent"],"properties":{"id":{"type":"string"},"sent":{"type":"integer"}}}'
    - mapping: |
        meta subject = "intel.weather.nws.alert"
        meta msgid = "nws:" + this.id
        root = this.merge({"source": "nws", "fetchedAt": now()})
    - catch:
        - mapping: |
            meta subject = "evt.feed.nws.rejected"
            meta msgid = "rej:nws:" + content().string().hash("xxhash64").encode("hex") + ":" + timestamp_unix_nano().string()
            root = {"source": "nws", "reason": error(), "raw": content().string().slice(0, 2000), "at": now()}
    - dedupe: { cache: seen, key: '${! @msgid }' }   # in-memory seen-set; restart replays are caught by Nats-Msg-Id
output:
  retry:
    max_retries: 0          # forever: a NATS outage blocks (backpressure), never drops
    backoff: { initial_interval: 500ms, max_interval: 10s, max_elapsed_time: 0s }
    output:
      nats_jetstream:
        urls: [ "${NATS_URL:nats://127.0.0.1:34222}" ]
        subject: ${! @subject }
        headers:
          Nats-Msg-Id: ${! @msgid }
        max_in_flight: 64
