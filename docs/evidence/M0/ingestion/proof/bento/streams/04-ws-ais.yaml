# Source 4 - WebSocket stream (aisstream-style AIS positions, 50 msg/s). Load source for the chaos test.
input:
  websocket:
    url: ws://127.0.0.1:38081/ais
    connection: { max_retries: 0 }
pipeline:
  processors:
    - mapping: 'root = content().string().parse_json()'
    - json_schema:
        schema: '{"type":"object","required":["mmsi","ts","lat","lon"],"properties":{"mmsi":{"type":"integer"},"ts":{"type":"integer"},"lat":{"type":"number","minimum":-90,"maximum":90},"lon":{"type":"number","minimum":-180,"maximum":180}}}'
    - mapping: |
        meta subject = "evt.world.sea." + this.mmsi.int64().string()
        meta msgid = "ais:" + this.mmsi.int64().string() + ":" + this.ts.int64().string()
        root = this.merge({"source": "ais", "fetchedAt": now()})
    - branch:
        request_map: 'root = {"fetchedAt": now(), "count": 1, "lastError": null}'
        processors:
          - cache: { resource: live, operator: set, key: status.ais, value: '${! content() }' }
    - catch:
        - mapping: |
            meta subject = "evt.feed.ais.rejected"
            meta msgid = "rej:ais:" + content().string().hash("xxhash64").encode("hex") + ":" + timestamp_unix_nano().string()
            root = {"source": "ais", "reason": error(), "raw": content().string().slice(0, 2000), "at": now()}
output:
  retry:
    max_retries: 0          # forever: a NATS outage blocks (backpressure), never drops
    backoff: { initial_interval: 500ms, max_interval: 10s, max_elapsed_time: 0s }
    output:
      nats_jetstream:
        urls: [ "${NATS_URL:nats://127.0.0.1:34222}" ]
        subject: ${! @subject }
        headers:
          Nats-Msg-Id: ${! @msgid }
        max_in_flight: 64
