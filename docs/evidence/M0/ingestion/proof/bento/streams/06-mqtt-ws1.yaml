# Source 6 - MQTT subscription (weather station), QoS 1, persistent session.
input:
  mqtt:
    urls: [ tcp://127.0.0.1:31883 ]
    client_id: onemind-ingest-ws
    topics: [ sensors/+/reading ]
    qos: 1
    clean_session: false
pipeline:
  processors:
    - json_schema:
        schema: '{"type":"object","required":["station","seq","tempC"],"properties":{"seq":{"type":"integer"},"tempC":{"type":"number"}}}'
    - mapping: |
        meta subject = "tel." + this.station + ".weather.reading"
        meta msgid = "mqtt:" + this.station + ":" + this.seq.int64().string()
        root = this.merge({"source": "mqtt", "fetchedAt": now()})
    - branch:
        request_map: 'root = {"fetchedAt": now(), "count": 1, "lastError": null}'
        processors:
          - cache: { resource: live, operator: set, key: status.mqtt, value: '${! content() }' }
    - catch:
        - mapping: |
            meta subject = "evt.feed.mqtt.rejected"
            meta msgid = "rej:mqtt:" + content().string().hash("xxhash64").encode("hex") + ":" + timestamp_unix_nano().string()
            root = {"source": "mqtt", "reason": error(), "raw": content().string().slice(0, 2000), "at": now()}
output:
  retry:
    max_retries: 0          # forever: a NATS outage blocks (backpressure), never drops
    backoff: { initial_interval: 500ms, max_interval: 10s, max_elapsed_time: 0s }
    output:
      nats_jetstream:
        urls: [ "${NATS_URL:nats://127.0.0.1:34222}" ]
        subject: ${! @subject }
        headers:
          Nats-Msg-Id: ${! @msgid }
        max_in_flight: 64
