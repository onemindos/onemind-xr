# Source 9 - HTML scraping (utility outage page). Regex extraction; fragile by nature.
input:
  generate: { interval: 15s, mapping: 'root = ""' }   # empty body: the http processor sends the message as the request body
pipeline:
  processors:
    - http:
        url: http://127.0.0.1:38080/outages.html
        verb: GET
        rate_limit: rl_outages
        backoff_on: [ 429, 503 ]
        retries: 3
        retry_period: 2s
        timeout: 10s
    - catch:
        - branch:
            request_map: 'root = {"fetchedAt": null, "code": @http_status_code.or("0"), "count": 0, "lastError": error(), "errorAt": now()}'
            processors:
              - cache: { resource: live, operator: set, key: "status.outages.error", value: '${! content() }' }
        - mapping: root = deleted()
    - mapping: |
        root = content().string().re_find_all_submatch("<tr data-id=\"([^\"]+)\"><td class=\"name\">([^<]+)</td><td class=\"cust\">([0-9]+)</td></tr>").map_each(m -> {"id": m.index(1), "name": m.index(2), "customers": m.index(3).number().int64()})
    - branch:
        request_map: 'root = {"fetchedAt": now(), "code": @http_status_code.or("0"), "count": this.length(), "lastError": null}'
        processors:
          - cache: { resource: live, operator: set, key: "status.outages", value: '${! content() }' }
    - unarchive: { format: json_array }
    - json_schema:
        schema: '{"type":"object","required":["id","name","customers"],"properties":{"customers":{"type":"number"}}}'
    - mapping: |
        meta subject = "intel.infra.outages.event"
        meta msgid = "outages:" + this.id + ":" + this.customers.int64().string()
        root = this.merge({"source": "outages", "fetchedAt": now()})
    - catch:
        - mapping: |
            meta subject = "evt.feed.outages.rejected"
            meta msgid = "rej:outages:" + content().string().hash("xxhash64").encode("hex") + ":" + timestamp_unix_nano().string()
            root = {"source": "outages", "reason": error(), "raw": content().string().slice(0, 2000), "at": now()}
    - dedupe: { cache: seen, key: '${! @msgid }' }   # in-memory seen-set; restart replays are caught by Nats-Msg-Id
output:
  retry:
    max_retries: 0          # forever: a NATS outage blocks (backpressure), never drops
    backoff: { initial_interval: 500ms, max_interval: 10s, max_elapsed_time: 0s }
    output:
      nats_jetstream:
        urls: [ "${NATS_URL:nats://127.0.0.1:34222}" ]
        subject: ${! @subject }
        headers:
          Nats-Msg-Id: ${! @msgid }
        max_in_flight: 64
