# Source 5 - Webhook push (CAP-style alerts POSTed to us). The HTTP response is held until the
# message is acknowledged by the output, so a NATS outage turns into a non-2xx and the sender retries.
input:
  http_server:
    address: 127.0.0.1:38090
    path: /webhook/cap
    allowed_verbs: [ POST ]
    timeout: 5s
pipeline:
  processors:
    - json_schema:
        schema: '{"type":"object","required":["identifier","event","sent"],"properties":{"identifier":{"type":"string"}}}'
    - mapping: |
        meta subject = "intel.alert.cap.alert"
        meta msgid = "cap:" + this.identifier
        root = this.merge({"source": "cap", "fetchedAt": now()})
    - branch:
        request_map: 'root = {"fetchedAt": now(), "count": 1, "lastError": null}'
        processors:
          - cache: { resource: live, operator: set, key: status.cap, value: '${! content() }' }
    - catch:
        - mapping: |
            meta subject = "evt.feed.cap.rejected"
            meta msgid = "rej:cap:" + content().string().hash("xxhash64").encode("hex") + ":" + timestamp_unix_nano().string()
            root = {"source": "cap", "reason": error(), "raw": content().string().slice(0, 2000), "at": now()}
output:
  retry:
    max_retries: 0          # forever: a NATS outage blocks (backpressure), never drops
    backoff: { initial_interval: 500ms, max_interval: 10s, max_elapsed_time: 0s }
    output:
      nats_jetstream:
        urls: [ "${NATS_URL:nats://127.0.0.1:34222}" ]
        subject: ${! @subject }
        headers:
          Nats-Msg-Id: ${! @msgid }
        max_in_flight: 64
