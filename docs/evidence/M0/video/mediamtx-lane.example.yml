# video-lane test instance (not the session's shared MediaMTX). Offset ports, localhost only.
logLevel: info
logDestinations: [stdout]
authMethod: internal
authInternalUsers:
  - user: pub-drone
    pass: ${PUBPASS}
    ips: []
    permissions:
      - {action: publish, path: "~^(drone|cam)/"}
  - user: viewer
    pass: ${RDPASS}
    ips: []
    permissions:
      - {action: read, path: ""}
      - {action: playback, path: ""}
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - {action: api}
      - {action: metrics}
api: true
apiAddress: 127.0.0.1:19997
metrics: true
metricsAddress: 127.0.0.1:19998
playback: true
playbackAddress: 127.0.0.1:19996
pprof: false
rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:18554
rtmp: true
rtmpAddress: 127.0.0.1:11935
hls: true
hlsAddress: 127.0.0.1:18888
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
webrtc: true
webrtcAddress: 127.0.0.1:18889
webrtcLocalUDPAddress: 127.0.0.1:18189
webrtcLocalTCPAddress: ""
srt: true
srtAddress: 127.0.0.1:18890
moq: false

pathDefaults:
  rtspDemuxMpegts: true
  record: true
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10s
  recordDeleteAfter: 1h
paths:
  "~^(drone|cam)/[a-z0-9-]+$":
